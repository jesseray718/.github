name: Python quality

on:
  workflow_call:
    inputs:
      python-version:
        description: Python version to use
        required: false
        default: "3.12"
        type: string
      compile-path:
        description: Directory or file tree to compile
        required: false
        default: "."
        type: string
      test-command:
        description: Shell command used to run tests
        required: false
        default: ""
        type: string

permissions:
  contents: read

jobs:
  python-quality:
    name: Python quality
    runs-on: ubuntu-latest

    steps:
      - name: Check out caller repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ inputs.python-version }}

      - name: Compile Python sources
        shell: bash
        run: |
          set -euo pipefail
          if find "${{ inputs.compile-path }}" -type f -name '*.py' -print -quit | grep -q .; then
            python -m compileall -q "${{ inputs.compile-path }}"
          else
            echo "No Python sources found; skipping compilation."
          fi

      - name: Install lint tool
        shell: bash
        run: python -m pip install --upgrade pip ruff

      - name: Lint Python sources
        shell: bash
        run: |
          set -euo pipefail
          if find "${{ inputs.compile-path }}" -type f -name '*.py' -print -quit | grep -q .; then
            ruff check --select E9,F63,F7,F82 "${{ inputs.compile-path }}"
          else
            echo "No Python sources found; skipping lint."
          fi

      - name: Run tests
        if: inputs.test-command != ''
        shell: bash
        run: ${{ inputs.test-command }}
