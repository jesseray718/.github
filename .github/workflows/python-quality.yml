name: Python quality

on:
  workflow_call:

permissions:
  contents: read

jobs:
  python-quality:
    name: Python quality
    runs-on: ubuntu-latest

    steps:
      - name: Check out caller repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Detect Python project
        id: project
        shell: bash
        run: |
          if find . -type f -name '*.py' -not -path './.git/*' -print -quit | grep -q .; then
            echo "has_python=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_python=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Install quality tools
        if: steps.project.outputs.has_python == 'true'
        run: python -m pip install --upgrade pip ruff

      - name: Lint Python
        if: steps.project.outputs.has_python == 'true'
        run: ruff check .

      - name: Report non-Python repository
        if: steps.project.outputs.has_python != 'true'
        run: echo "No Python files found; Python quality check skipped."
